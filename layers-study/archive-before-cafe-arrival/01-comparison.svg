<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img"><title>Layers from open plot to contained rooms — preliminary bubble study</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a04459" stroke-width="1.5"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#939b91" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1800" height="1360" fill="#fcfbf6" stroke="none" stroke-width="1"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="56" font-size="14" fill="#67736c" font-weight="600" text-anchor="start">SAME PLOT / SAME FOOTPRINT LIMIT / DIFFERENT SPATIAL SEQUENCES</text><text x="60" y="112" font-size="42" fill="#263c39" font-weight="700" text-anchor="start">Compare how you cross the layers.</text><rect x="60" y="150" width="28" height="28" fill="#e9e5d4" stroke="none" stroke-width="1"/><text x="101" y="171" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">1  OPEN GROUND</text><rect x="490" y="150" width="28" height="28" fill="#dfa98b" stroke="none" stroke-width="1"/><text x="531" y="171" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">2  COVERED THRESHOLD</text><rect x="920" y="150" width="28" height="28" fill="#e7cc76" stroke="none" stroke-width="1"/><text x="961" y="171" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">3  SHARED INTERIOR</text><rect x="1350" y="150" width="28" height="28" fill="#99b9aa" stroke="none" stroke-width="1"/><text x="1391" y="171" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">4  CONTAINED ROOMS</text><text x="60" y="213" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Colours describe spatial conditions, not functions. The same numbers follow the journey in plan and section.</text><text x="60" y="290" font-size="28" fill="#263c39" font-weight="700" text-anchor="start">A / Linked pockets</text><text x="60" y="325" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Cross the layers in sequence.</text><rect x="90" y="380" width="420" height="410" fill="#e7cc76" stroke="#263c39" stroke-width="2"/><rect x="90" y="720" width="420" height="70" fill="#dfa98b" stroke="none" stroke-width="1"/><rect x="90" y="790" width="420" height="85" fill="#e9e5d4" stroke="none" stroke-width="1"/><rect x="90" y="380" width="420" height="105" fill="#99b9aa" stroke="none" stroke-width="1"/><rect x="90" y="485" width="90" height="235" fill="#99b9aa" stroke="none" stroke-width="1"/><circle cx="110" cy="827" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="110" y="832" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">1</text><circle cx="110" cy="756" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="110" y="761" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">2</text><circle cx="220" cy="530" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="220" y="535" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">3</text><circle cx="110" cy="410" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="110" y="415" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">4</text><line x1="90" y1="380" x2="510" y2="380" stroke="#263c39" stroke-width="5" /><line x1="90" y1="380" x2="90" y2="720" stroke="#263c39" stroke-width="5" /><line x1="510" y1="380" x2="510" y2="649" stroke="#263c39" stroke-width="5" /><line x1="510" y1="694" x2="510" y2="720" stroke="#263c39" stroke-width="5" /><line x1="180" y1="485" x2="180" y2="572" stroke="#263c39" stroke-width="5" /><line x1="180" y1="635" x2="180" y2="720" stroke="#263c39" stroke-width="5" /><line x1="90" y1="485" x2="205" y2="485" stroke="#263c39" stroke-width="5" /><line x1="255" y1="485" x2="510" y2="485" stroke="#263c39" stroke-width="5" /><line x1="90" y1="720" x2="180" y2="720" stroke="#263c39" stroke-width="5" /><line x1="180" y1="718" x2="245" y2="718" stroke="#39788d" stroke-width="1.3" /><line x1="180" y1="722" x2="245" y2="722" stroke="#39788d" stroke-width="1.3" /><line x1="295" y1="718" x2="510" y2="718" stroke="#39788d" stroke-width="1.3" /><line x1="295" y1="722" x2="510" y2="722" stroke="#39788d" stroke-width="1.3" /><line x1="90" y1="724" x2="90" y2="790" stroke="#dfa98b" stroke-width="6" /><line x1="510" y1="724" x2="510" y2="790" stroke="#dfa98b" stroke-width="6" /><line x1="90" y1="790" x2="510" y2="790" stroke="#67736c" stroke-width="1.5" stroke-dasharray="7 5"/><path d="M265 866 L265 750 L230 675 L230 459" fill="none" stroke="#a04459" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="925" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">The south arrival remains outside first.</text><text x="60" y="954" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">A porch leads into a shared interior,</text><text x="60" y="983" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">then small rooms nest along its edge.</text><text x="60" y="1040" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">Risk: a corridor with rooms attached.</text><text x="60" y="1068" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">Test each shared pocket as a place to stay,</text><text x="60" y="1096" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">not just a route through the building.</text><text x="640" y="290" font-size="28" fill="#263c39" font-weight="700" text-anchor="start">B / Pocket court</text><text x="640" y="325" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Nest an outdoor pocket inside shared space.</text><rect x="670" y="380" width="420" height="410" fill="#e7cc76" stroke="#263c39" stroke-width="2"/><rect x="670" y="720" width="420" height="70" fill="#dfa98b" stroke="none" stroke-width="1"/><rect x="670" y="790" width="420" height="85" fill="#e9e5d4" stroke="none" stroke-width="1"/><rect x="670" y="380" width="420" height="105" fill="#99b9aa" stroke="none" stroke-width="1"/><rect x="670" y="485" width="90" height="235" fill="#99b9aa" stroke="none" stroke-width="1"/><circle cx="690" cy="827" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="690" y="832" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">1</text><circle cx="690" cy="756" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="690" y="761" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">2</text><circle cx="800" cy="530" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="800" y="535" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">3</text><circle cx="690" cy="410" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="690" y="415" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">4</text><rect x="867" y="533" width="72" height="120" fill="#e9e5d4" stroke="#263c39" stroke-width="2"/><text x="879" y="582" font-size="14" fill="#263c39" font-weight="600" text-anchor="start">OPEN</text><text x="879" y="604" font-size="14" fill="#263c39" font-weight="600" text-anchor="start">COURT</text><rect x="867" y="533" width="72" height="120" fill="none" stroke="#e9e5d4" stroke-width="5"/><line x1="867" y1="531" x2="939" y2="531" stroke="#39788d" stroke-width="1.3" /><line x1="867" y1="535" x2="939" y2="535" stroke="#39788d" stroke-width="1.3" /><line x1="865" y1="533" x2="865" y2="653" stroke="#39788d" stroke-width="1.3" /><line x1="869" y1="533" x2="869" y2="653" stroke="#39788d" stroke-width="1.3" /><line x1="937" y1="533" x2="937" y2="653" stroke="#39788d" stroke-width="1.3" /><line x1="941" y1="533" x2="941" y2="653" stroke="#39788d" stroke-width="1.3" /><line x1="867" y1="651" x2="880" y2="651" stroke="#39788d" stroke-width="1.3" /><line x1="867" y1="655" x2="880" y2="655" stroke="#39788d" stroke-width="1.3" /><line x1="922" y1="651" x2="939" y2="651" stroke="#39788d" stroke-width="1.3" /><line x1="922" y1="655" x2="939" y2="655" stroke="#39788d" stroke-width="1.3" /><line x1="670" y1="380" x2="1090" y2="380" stroke="#263c39" stroke-width="5" /><line x1="670" y1="380" x2="670" y2="720" stroke="#263c39" stroke-width="5" /><line x1="1090" y1="380" x2="1090" y2="649" stroke="#263c39" stroke-width="5" /><line x1="1090" y1="694" x2="1090" y2="720" stroke="#263c39" stroke-width="5" /><line x1="760" y1="485" x2="760" y2="572" stroke="#263c39" stroke-width="5" /><line x1="760" y1="635" x2="760" y2="720" stroke="#263c39" stroke-width="5" /><line x1="670" y1="485" x2="785" y2="485" stroke="#263c39" stroke-width="5" /><line x1="835" y1="485" x2="1090" y2="485" stroke="#263c39" stroke-width="5" /><line x1="670" y1="720" x2="760" y2="720" stroke="#263c39" stroke-width="5" /><line x1="760" y1="718" x2="825" y2="718" stroke="#39788d" stroke-width="1.3" /><line x1="760" y1="722" x2="825" y2="722" stroke="#39788d" stroke-width="1.3" /><line x1="875" y1="718" x2="1090" y2="718" stroke="#39788d" stroke-width="1.3" /><line x1="875" y1="722" x2="1090" y2="722" stroke="#39788d" stroke-width="1.3" /><line x1="670" y1="724" x2="670" y2="790" stroke="#dfa98b" stroke-width="6" /><line x1="1090" y1="724" x2="1090" y2="790" stroke="#dfa98b" stroke-width="6" /><line x1="670" y1="790" x2="1090" y2="790" stroke="#67736c" stroke-width="1.5" stroke-dasharray="7 5"/><path d="M845 866 L845 750 L810 675 L810 459" fill="none" stroke="#a04459" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="640" y="925" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">Enter through the same south porch.</text><text x="640" y="954" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">The shared interior surrounds a small</text><text x="640" y="983" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">open court; rooms form its outer edge.</text><text x="640" y="1040" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">Risk: the court consumes scarce floor area.</text><text x="640" y="1068" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">The earlier large court is reduced to a</text><text x="640" y="1096" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">small test pocket, not two separate wings.</text><text x="1220" y="290" font-size="28" fill="#263c39" font-weight="700" text-anchor="start">C / Vertical commons</text><text x="1220" y="325" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Repeat the layers on successive landings.</text><rect x="1250" y="380" width="420" height="410" fill="#e7cc76" stroke="#263c39" stroke-width="2"/><rect x="1250" y="720" width="420" height="70" fill="#dfa98b" stroke="none" stroke-width="1"/><rect x="1250" y="790" width="420" height="85" fill="#e9e5d4" stroke="none" stroke-width="1"/><rect x="1250" y="380" width="420" height="105" fill="#99b9aa" stroke="none" stroke-width="1"/><rect x="1250" y="485" width="90" height="235" fill="#99b9aa" stroke="none" stroke-width="1"/><circle cx="1270" cy="827" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="1270" y="832" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">1</text><circle cx="1270" cy="756" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="1270" y="761" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">2</text><circle cx="1380" cy="530" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="1380" y="535" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">3</text><circle cx="1270" cy="410" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="1270" y="415" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">4</text><rect x="1520" y="540" width="110" height="140" fill="#d7d9d4" stroke="#263c39" stroke-width="1"/><text x="1539" y="580" font-size="16" fill="#263c39" font-weight="500" text-anchor="start">Shared</text><text x="1539" y="603" font-size="16" fill="#263c39" font-weight="500" text-anchor="start">landings</text><text x="1539" y="626" font-size="16" fill="#263c39" font-weight="500" text-anchor="start">above</text><line x1="1250" y1="380" x2="1670" y2="380" stroke="#263c39" stroke-width="5" /><line x1="1250" y1="380" x2="1250" y2="720" stroke="#263c39" stroke-width="5" /><line x1="1670" y1="380" x2="1670" y2="649" stroke="#263c39" stroke-width="5" /><line x1="1670" y1="694" x2="1670" y2="720" stroke="#263c39" stroke-width="5" /><line x1="1340" y1="485" x2="1340" y2="572" stroke="#263c39" stroke-width="5" /><line x1="1340" y1="635" x2="1340" y2="720" stroke="#263c39" stroke-width="5" /><line x1="1250" y1="485" x2="1365" y2="485" stroke="#263c39" stroke-width="5" /><line x1="1415" y1="485" x2="1670" y2="485" stroke="#263c39" stroke-width="5" /><line x1="1250" y1="720" x2="1340" y2="720" stroke="#263c39" stroke-width="5" /><line x1="1340" y1="718" x2="1405" y2="718" stroke="#39788d" stroke-width="1.3" /><line x1="1340" y1="722" x2="1405" y2="722" stroke="#39788d" stroke-width="1.3" /><line x1="1455" y1="718" x2="1670" y2="718" stroke="#39788d" stroke-width="1.3" /><line x1="1455" y1="722" x2="1670" y2="722" stroke="#39788d" stroke-width="1.3" /><line x1="1250" y1="724" x2="1250" y2="790" stroke="#dfa98b" stroke-width="6" /><line x1="1670" y1="724" x2="1670" y2="790" stroke="#dfa98b" stroke-width="6" /><line x1="1250" y1="790" x2="1670" y2="790" stroke="#67736c" stroke-width="1.5" stroke-dasharray="7 5"/><path d="M1425 866 L1425 750 L1390 675 L1390 459" fill="none" stroke="#a04459" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1220" y="925" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">The south porch leads to a compact hall.</text><text x="1220" y="954" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">Shared landings extend the arrival upward;</text><text x="1220" y="983" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">contained rooms sit beside these landings.</text><text x="1220" y="1040" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">Risk: the public life moves upstairs.</text><text x="1220" y="1068" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">Keep a useful shared ground floor and</text><text x="1220" y="1096" font-size="18" fill="#67736c" font-weight="400" text-anchor="start">reach every landing by lift as well as stair.</text><line x1="60" y1="1180" x2="1740" y2="1180" stroke="#d8dbd1" stroke-width="1" /><text x="60" y="1220" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">A: horizontal progression. B: an outdoor pocket inside shared space. C: progression continues vertically.</text><text x="60" y="1253" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">All keep south pedestrian arrival, an east walk-in and east access to underground parking.</text><text x="60" y="1286" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">408 m² fits inside the 4 m inset. Ramp and full program fit are not yet resolved; bubbles are not room areas.</text></g></svg>