eight="400">Co-working + offices</text><g data-bubble="Meetings" data-program="work"><ellipse cx="699" cy="877" rx="88" ry="44" fill="#adb9cd" fill-opacity="0.8" stroke="#233b38" stroke-opacity=".6" stroke-width="1.4" /><text x="699" y="882" font-size="17" fill="#233b38" text-anchor="middle" font-weight="550">Meetings</text></g><g data-bubble="Productive growing + technical support" data-program="grow"><ellipse cx="1008" cy="877" rx="127" ry="65" fill="#becb95" fill-opacity="0.8" stroke="#233b38" stroke-opacity=".6" stroke-width="1.4" /><text x="1008" y="872" font-size="17" fill="#233b38" text-anchor="middle" font-weight="550">Productive growing</text><text x="1008" y="893" font-size="17" fill="#233b38" text-anchor="middle" font-weight="550">+ technical support</text></g><path d="M839 727 Q971 749 997 810" fill="none" stroke="#917342" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-917342)"/><text x="579" y="994" font-size="18" fill="#233b38" text-anchor="middle" font-weight="400">NESTING: smaller rooms sit within broader shared settings,</text><text x="579" y="1022" font-size="18" fill="#233b38" text-anchor="middle" font-weight="400">connected by clear thresholds in plan and section.</text><rect x="1292" y="483" width="300" height="217" fill="#f5f4ee" stroke="none" rx="0"/><text x="1304" y="503" font-size="11" fill="#67746e" text-anchor="start" font-weight="650">SITE ANCHOR / EXISTING TRACES</text><polygon points="1398.7,613.4 1427.0,622.0 1442.9,607.8 1453.2,563.7 1452.8,562.4 1451.8,558.9 1417.3,545.5" fill="#efe0b9" stroke="#233b38" stroke-width="1.5"/><polyline points="1466.8,550.2 1463.1,560.6" fill="none" stroke="#347e8c" stroke-width="2"/><polyline points="1463.1,560.6 1460.9,565.9" fill="none" stroke="#347e8c" stroke-width="2"/><polyline points="1460.9,565.9 1442.1,610.9" fill="none" stroke="#347e8c" stroke-width="2"/><polyline points="1442.1,610.9 1440.1,614.6" fill="none" stroke="#347e8c" stroke-width="2"/><polyline p