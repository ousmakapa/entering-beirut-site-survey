<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1230" viewBox="0 0 1680 1230" role="img" aria-label="Common entrance and program relationships"><title>Common entrance and program relationships</title><desc>Proposed bubble relationships, not measured plans. South pedestrian entrance and east ramp to underground parking are constant. Every option pairs a ground diagram with above-ground and B1 sectional relationships.</desc><defs><marker id="arr-917342" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#917342" stroke-width="1.6"/></marker><marker id="arr-ac5362" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#ac5362" stroke-width="1.6"/></marker><marker id="arr-347e8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#347e8c" stroke-width="1.6"/></marker><marker id="arr-67746e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#67746e" stroke-width="1.6"/></marker><pattern id="road-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><line x1="0" y1="0" x2="0" y2="12" stroke="#acaaa1" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1680" height="1230" fill="#fcfbf7" stroke="none" rx="0"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="40" font-size="13" fill="#67746e" text-anchor="start" font-weight="650">ENTERING BEIRUT / COMMON BRIEF</text><text x="48" y="105" font-size="39" fill="#233b38" text-anchor="start" font-weight="600">Two arrivals. One welcome. Several connected layers.</text><text x="48" y="147" font-size="20" fill="#67746e" text-anchor="start" font-weight="400">The entrances are the fixed starting point; the three options test what happens after arrival.</text><g data-bubble="SOUTH / ON FOOT C1 stairs → main door" data-program="public"><ellipse cx="278" cy="319" rx="170" ry="66" fill="#e8c990" fill-opacity="0.8" stroke="#233b38" stroke-opacity=".6" stroke-width="1.4" /><text x="278" y="314" font-size="17" fill="#233b38" text-anchor="middle" font-weight="550">SOUTH / ON FOOT</text><text x="278" y="335" font-size="17" fill="#233b38" text-anchor="middle" font-weight="550">C1 stairs → main door</text></g><g data-bubble="EAST / STREET 80 Ramp → B1 → lift / stairs" data-program="support"><ellipse cx="1205" cy="319" rx="192" ry="66" fill="#d2d0c8" fill-opacity="0.8" stroke="#233b38" stroke-opacity=".6" stroke-width="1.4" /><text x="1205" y="314" font-size="17" fill="#233b38" text-anchor="middle" font-weight="550">EAST / STREET 80</text><text x="1205" y="335" font-size="17" fill="#233b38" text-anchor="middle" font-weight="550">Ramp → B1 → lift / stairs</text></g><path d="M449 318 L620 318" fill="none" stroke="#ac5362" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-ac5362)"/><path d="M1013 318 L857 318" fill="none" stroke="#347e8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr-347e8c)"/><ellipse cx="738" cy="318" rx="119" ry="72" fill="#f8efd9" stroke="#917342" stroke-width="2"/><text x="738" y="318" font-size="18" fill="#233b38" text-anchor="middle" font-weight="600">Shared welcome</text><text x="738" y="349" font-size="12" fill="#67746e" text-anchor="middle" font-weight="400">same public address</text><text x="1155" y="417" font-size="15" fill="#347e8c" text-anchor="middle" font-weight="400">A separate east walk-in door also joins the welcome.</text><path d="M738 391 L738 470" fill="none" stroke="#917342" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arr-917342)"/><ellipse cx="738" cy="613" rx="390" ry="137" fill="#f7eddb" stroke="#917342" 