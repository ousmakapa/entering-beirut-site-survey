770" font-size="15" fill="#67746e" text-anchor="start" font-weight="400">B1 underground parking.</text><text x="1300" y="795" font-size="15" fill="#67746e" text-anchor="start" font-weight="400">Service has a separate</text><text x="1300" y="820" font-size="15" fill="#67746e" text-anchor="start" font-weight="400">route to test. Ground levels,</text><text x="1300" y="845" font-size="15" fill="#67746e" text-anchor="start" font-weight="400">ramp and basement rules:</text><text x="1300" y="870" font-size="15" fill="#67746e" text-anchor="start" font-weight="400">VERIFY. Capacity: TBD.</text><line x1="48" y1="1071" x2="1632" y2="1071" stroke="#d5d8ce" stroke-width="1" /><rect x="50" y="1095" width="18" height="18" fill="#e8c990" stroke="#d5d8ce" rx="9"/><text x="77" y="1108" font-size="14" fill="#233b38" text-anchor="start" font-weight="400">Public / commercial</text><rect x="297" y="1095" width="18" height="18" fill="#d6a297" stroke="#d5d8ce" rx="9"/><text x="324" y="1108" font-size="14" fill="#233b38" text-anchor="start" font-weight="400">Culture / exhibition</text><rect x="544" y="1095" width="18" height="18" fill="#a6c2b6" stroke="#d5d8ce" rx="9"/><text x="571" y="1108" font-size="14" fill="#233b38" text-anchor="start" font-weight="400">Learning / workshop</text><rect x="791" y="1095" width="18" height="18" fill="#adb9cd" stroke="#d5d8ce" rx="9"/><text x="818" y="1108" font-size="14" fill="#233b38" text-anchor="start" font-weight="400">Work / meetings</text><rect x="1038" y="1095" width="18" height="18" fill="#becb95" stroke="#d5d8ce" rx="9"/><text x="1065" y="1108" font-size="14" fill="#233b38" text-anchor="start" font-weight="400">Growing</text><rect x="1285" y="1095" width="18" height="18" fill="#d2d0c8" stroke="#d5d8ce" rx="9"/><text x="1312" y="1108" font-size="14" fill="#233b38" text-anchor="start" font-weight="400">Circulation / support</text><text x="50" y="1160" font-size="14" fill="#67746e" text-anchor="start" font-weight="400">Official brief: 1,500 m² total; 30% footprint; 4 floors / 17 m; 4 m setbacks. Area-counting and parking interpretation: VERIFY.</text><text x="50" y="1198" font-size="12" fill="#67746e" text-anchor="start" font-weight="400">PROGRAM RELATIONSHIPS / position and bubble sizes are schematic. Proposed entrances follow the student brief of 2026-09-17.</text></g></svg>