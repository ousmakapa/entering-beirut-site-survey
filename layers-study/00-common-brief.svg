<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img"><title>Layers from open plot to contained rooms — preliminary bubble study</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a04459" stroke-width="1.5"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="10" stroke="#939b91" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1800" height="1510" fill="#fcfbf6" stroke="none" stroke-width="1"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="53" font-size="14" fill="#67736c" font-weight="600" text-anchor="start">ENTERING BEIRUT / COMMON BRIEF / LAYERS → NESTING</text><text x="60" y="110" font-size="42" fill="#263c39" font-weight="700" text-anchor="start">The layers begin before the front door.</text><text x="60" y="149" font-size="23" fill="#67736c" font-weight="400" text-anchor="start">A compact building inside an open plot — not a building stretched over the whole site.</text><rect x="60" y="188" width="28" height="28" fill="#e9e5d4" stroke="none" stroke-width="1"/><text x="101" y="209" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">1  OPEN GROUND</text><rect x="490" y="188" width="28" height="28" fill="#dfa98b" stroke="none" stroke-width="1"/><text x="531" y="209" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">2  COVERED THRESHOLD</text><rect x="920" y="188" width="28" height="28" fill="#e7cc76" stroke="none" stroke-width="1"/><text x="961" y="209" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">3  SHARED INTERIOR</text><rect x="1350" y="188" width="28" height="28" fill="#99b9aa" stroke="none" stroke-width="1"/><text x="1391" y="209" font-size="18" fill="#263c39" font-weight="600" text-anchor="start">4  CONTAINED ROOMS</text><text x="60" y="251" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Colours describe spatial conditions, not functions. The same numbers follow the journey in plan and section.</text><g transform="translate(0,55)"><text x="60" y="281" font-size="18" fill="#263c39" font-weight="700" text-anchor="start">01 / THE WHOLE PLOT</text><text x="60" y="309" font-size="15" fill="#67736c" font-weight="400" text-anchor="start">True plot geometry · north up · metres</text><polygon points="97.84800000000001,717.344 264.752,774.92 363.016,693.5840000000001 433.584,433.736 431.504,425.488 426.176,404.52 222.904,317.504 97.84800000000001,717.344" fill="#e9e5d4" stroke="#263c39" stroke-width="2" /><polygon points="137.6676393910564,697.2298674475041 242.87219425128666,360.86064713568817 399.05381351134747,427.71835395971436 400.4824947019159,433.34083654301764 400.50645918281265,433.43586492688104 334.7941865688365,675.4039328074567 258.1948034223336,738.807492886468 137.6676393910564,697.2298674475041" fill="none" stroke="#949b8d" stroke-width="1.5" stroke-dasharray="6 5"/><polygon points="306.96103975210366,626.6865324935975 363.09640705886915,443.0760193486947 233.03896024789634,403.3134675064025 176.90359294113085,586.9239806513053 306.96103975210366,626.6865324935975" fill="#e7cc76" stroke="#263c39" stroke-width="2.5" /><polygon points="176.90359294113085,586.9239806513053 306.96103975210366,626.6865324935975 313.97796066544936,603.7352183504846 183.92051385447655,563.9726665081924" fill="#dfa98b" stroke="#263c39" stroke-width="1" /><path d="M451 360 L491 515 L485 696" fill="none" stroke="#d7d9d4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"  /><text x="458" y="744" font-size="15" fill="#39788d" font-weight="600" text-anchor="start">STREET 80</text><path d="M447 533 L407 533" fill="none" stroke="#39788d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text x="430" y="470" font-size="14" fill="#39788d" font-weight="600" text-anchor="start">EAST</text><text x="430" y="490" font-size="14" fill="#39788d" font-weight="600" text-anchor="start">Parking entry</text><text x="430" y="510" font-size="14" fill="#39788d" font-weight="600" text-anchor="start">→ B1 below</text><path d="M394 588 L369 588" fill="none" stroke="#a04459" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="417" y="617" font-size="13" fill="#67736c" font-weight="400" text-anchor="start">Separate</text><text x="417" y="635" font-size="13" fill="#67736c" font-weight="400" text-anchor="start">walk-in</text><path d="M259 801 L244 737 L228 682" fill="none" stroke="#a04459" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="826" font-size="15" fill="#a04459" font-weight="700" text-anchor="start">SOUTH / C1 STAIRS → OPEN ARRIVAL</text><circle cx="218" cy="711" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="218" y="716" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">1</text><circle cx="243" cy="588" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="243" y="593" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">2</text><text x="256" y="530" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">TEST</text><text x="256" y="554" font-size="14" fill="#263c39" font-weight="600" text-anchor="middle">FOOTPRINT</text><line x1="492" y1="343" x2="492" y2="313" stroke="#263c39" stroke-width="2" /><path d="M487 322 L492 312 L497 322" fill="none" stroke="#263c39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  /><text x="492" y="302" font-size="15" fill="#263c39" font-weight="700" text-anchor="middle">N</text><line x1="78" y1="771" x2="158" y2="771" stroke="#263c39" stroke-width="2" /><line x1="78" y1="766" x2="78" y2="776" stroke="#263c39" stroke-width="2" /><line x1="158" y1="766" x2="158" y2="776" stroke="#263c39" stroke-width="2" /><text x="118" y="794" font-size="13" fill="#67736c" font-weight="400" text-anchor="middle">10 m</text><text x="60" y="867" font-size="15" fill="#67736c" font-weight="400" text-anchor="start">Solid edge = plot. Dashed edge = 4 m inset.</text><text x="60" y="890" font-size="15" fill="#67736c" font-weight="400" text-anchor="start">Coloured block = 17 × 24 m outer test envelope.</text><text x="60" y="913" font-size="15" fill="#67736c" font-weight="400" text-anchor="start">Entry porch / upper overlaps stay inside this block.</text></g><text x="650" y="355" font-size="20" fill="#263c39" font-weight="700" text-anchor="start">FROM SEPARATE CITY CONDITIONS TO A CONNECTED ARRIVAL</text><text x="650" y="392" font-size="20" fill="#67736c" font-weight="400" text-anchor="start">The neighbourhood, highway, bridge and northern frontages are not copied as seven rings.</text><text x="650" y="424" font-size="20" fill="#67736c" font-weight="400" text-anchor="start">At our plot, we test a sequence: ground, cover, shared space, then smaller rooms.</text><text x="650" y="456" font-size="20" fill="#67736c" font-weight="400" text-anchor="start">The south door receives people AFTER the bridge stairs; east vehicle access serves B1.</text><rect x="650" y="539" width="245" height="172" fill="#e9e5d4" stroke="#d8dbd1" stroke-width="1"/><circle cx="679" cy="570" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="679" y="575" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">1</text><text x="668" y="625" font-size="18" fill="#263c39" font-weight="700" text-anchor="start">OPEN GROUND</text><text x="668" y="659" font-size="16" fill="#263c39" font-weight="400" text-anchor="start">Pause before entering</text><path d="M877 692 L926 692" fill="none" stroke="#a04459" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="920" y="539" width="245" height="172" fill="#dfa98b" stroke="#d8dbd1" stroke-width="1"/><circle cx="949" cy="570" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="949" y="575" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">2</text><text x="938" y="625" font-size="18" fill="#263c39" font-weight="700" text-anchor="start">COVERED EDGE</text><text x="938" y="659" font-size="16" fill="#263c39" font-weight="400" text-anchor="start">Pass under a roof</text><path d="M1147 692 L1196 692" fill="none" stroke="#a04459" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1190" y="539" width="245" height="172" fill="#e7cc76" stroke="#d8dbd1" stroke-width="1"/><circle cx="1219" cy="570" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="1219" y="575" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">3</text><text x="1208" y="625" font-size="18" fill="#263c39" font-weight="700" text-anchor="start">SHARED INTERIOR</text><text x="1208" y="659" font-size="16" fill="#263c39" font-weight="400" text-anchor="start">Welcome; choose a route</text><path d="M1417 692 L1466 692" fill="none" stroke="#a04459" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1460" y="539" width="245" height="172" fill="#99b9aa" stroke="#d8dbd1" stroke-width="1"/><circle cx="1489" cy="570" r="16" fill="#fcfbf6" stroke="#263c39" stroke-width="1.5"/><text x="1489" y="575" font-size="16" fill="#263c39" font-weight="700" text-anchor="middle">4</text><text x="1478" y="625" font-size="18" fill="#263c39" font-weight="700" text-anchor="start">SMALLER ROOMS</text><text x="1478" y="659" font-size="16" fill="#263c39" font-weight="400" text-anchor="start">Cross another threshold</text><text x="650" y="773" font-size="19" fill="#263c39" font-weight="700" text-anchor="start">WHAT IS NOW CHECKED</text><text x="650" y="811" font-size="19" fill="#263c39" font-weight="400" text-anchor="start">Plot: 1,488.5 m². Brief maximum footprint: 30%, about 446.5 m².</text><text x="650" y="841" font-size="19" fill="#263c39" font-weight="400" text-anchor="start">All options test the same 17 × 24 m envelope: 408 m², or 27.4%.</text><text x="650" y="871" font-size="19" fill="#263c39" font-weight="400" text-anchor="start">Minimum plot-edge clearance: 4.41 m. The conservative 4 m inset is respected.</text><text x="650" y="901" font-size="19" fill="#263c39" font-weight="400" text-anchor="start">Roofed entry / projected upper floors stay inside that envelope.</text><text x="650" y="970" font-size="19" fill="#263c39" font-weight="700" text-anchor="start">WHAT IS NOT YET SOLVED</text><text x="650" y="1008" font-size="19" fill="#67736c" font-weight="400" text-anchor="start">The 1,500 m² program is unchanged. This is NOT a resolved room-area layout.</text><text x="650" y="1039" font-size="19" fill="#67736c" font-weight="400" text-anchor="start">Four 408 m² plates give only 1,632 m² before porch, court and void losses.</text><text x="650" y="1070" font-size="19" fill="#67736c" font-weight="400" text-anchor="start">B tests 60 m² of court loss across four levels; C tests 40 m² of floor openings.</text><text x="650" y="1101" font-size="19" fill="#67736c" font-weight="400" text-anchor="start">B1 is not an automatic extra allowance: area / floor counting needs clarification.</text><text x="650" y="1132" font-size="19" fill="#67736c" font-weight="400" text-anchor="start">Ramp, service access, basement extent, exits and room areas need measured plans.</text><text x="60" y="1045" font-size="18" fill="#263c39" font-weight="700" text-anchor="start">OPEN LAND ≠ ALL GARDEN</text><text x="60" y="1080" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Around 1,080 m² is outside the envelope.</text><text x="60" y="1106" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Some serves routes, ramp works and access.</text><text x="60" y="1132" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Landscape / public access are not allocated.</text><line x1="60" y1="1230" x2="1740" y2="1230" stroke="#d8dbd1" stroke-width="1" /><text x="60" y="1270" font-size="19" fill="#263c39" font-weight="700" text-anchor="start">RESEARCH → DRAWING DECISION</text><text x="60" y="1308" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">House N: use the gradual change between street and room — not its whole-site covering shell.</text><text x="60" y="1340" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">Sala Beckett: give arrival and shared circulation spatial character, not just a movement function.</text><text x="60" y="1372" font-size="20" fill="#263c39" font-weight="400" text-anchor="start">Layering is the relationship between settings. Nesting lets one setting belong within another.</text><text x="60" y="1450" font-size="17" fill="#67736c" font-weight="400" text-anchor="start">Sources and feasibility notes are linked on the review page. No final option or massing is selected.</text></g></svg>